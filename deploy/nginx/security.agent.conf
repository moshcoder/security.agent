# security.agent: a Moshpit origin (/etc/moshpit/templates/security.agent.conf, written to
# /etc/nginx/sites-available/security.agent by /opt/moshpit/scripts/setup-origin.sh).
# Port 80 serves too, on purpose: stock clients cannot verify a Moshpit certificate and the
# gateway forwards a status without its Location. No HSTS for the same reason.
# No request log: check queries and desktop calls are in the URL and body; nginx writes the
# request line into error-level entries too, hence crit.

server {
    listen 80;
    listen [::]:80;
    server_name security.agent;

    access_log off;
    error_log  /var/log/nginx/security.agent.error.log crit;
    client_max_body_size 256k;

    # The app: github.com/moshcoder/security.agent, systemd unit security-agent, /opt/security.agent.
    location / {
        proxy_pass http://127.0.0.1:8799;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The c0mpute analyst can take up to 100 s.
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name security.agent;

    ssl_certificate     /etc/ssl/moshpit/security.agent.crt;
    ssl_certificate_key /etc/ssl/moshpit/security.agent.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_conf_command Groups X25519MLKEM768:X25519:P-256;
    ssl_session_tickets off;
    ssl_session_cache shared:MoshpitSSL:10m;

    access_log off;
    error_log  /var/log/nginx/security.agent.error.log crit;
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8799;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
