# /etc/ssh/sshd_config.d/60-security-agent-tunnel.conf
# The security.agent desktop tunnels. Desktops log in as secagent-tunnel with a key
# that may only listen on its own loopback port (see authorized-keys). Everything
# else is off for this user, whatever the key line says.
Match User secagent-tunnel
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/local/lib/security-agent/authorized-keys %u
    AuthorizedKeysCommandUser nobody
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AllowTcpForwarding remote
    GatewayPorts no
    PermitOpen none
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /bin/false
    ClientAliveInterval 30
    ClientAliveCountMax 3
