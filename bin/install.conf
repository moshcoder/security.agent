# bin/install.sh settings for security.agent (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: settings go in $STATE_DIR/app.env, written from the logicsrc
# vault profullstack/security-agent--prod (SECAGENT_KEY, SECAGENT_ADMIN_KEY,
# SECAGENT_DB, optional SECAGENT_TC_CLIENT_ID).
#
# DOMAINS is empty on purpose: security.agent is a Moshpit name, so there is no
# Let's Encrypt certificate to get. Its nginx vhost proxies to PORT with the
# Moshpit-issued certificate that moshpit-renew.timer keeps fresh.
APP=security-agent
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/server.ts
PORT=8799
HEALTH_PATH=/health
DOMAINS=
ACCESS_LOG=off
